name: Benchmark smoke

on:
  pull_request:
    paths:
      - ".github/workflows/benchmark-smoke.yml"
      - "CMakeLists.txt"
      - "benchmarks/**"
      - "include/pineforge/hpo/**"
      - "src/core/**"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: benchmark-smoke-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  changes:
    runs-on: ubuntu-24.04
    outputs:
      docs_only: ${{ steps.classify.outputs.docs_only }}
    steps:
      - name: Check out PR history
        if: github.event_name == 'pull_request'
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Classify changed paths
        id: classify
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          docs_only=false
          if [[ "$EVENT_NAME" == "pull_request" ]]; then
            paths_file="$RUNNER_TEMP/benchmark-changed-paths"
            # Include both sides of renames; NUL delimiters preserve unusual filenames.
            git diff --name-only --no-renames -z "$PR_BASE_SHA...$PR_HEAD_SHA" -- > "$paths_file"
            if [[ -s "$paths_file" ]]; then
              docs_only=true
              while IFS= read -r -d '' path; do
                case "$path" in
                  # Test notes, executable docs tooling, and package metadata are code inputs.
                  docs/internal|docs/internal/*|docs/pages/filter_public_python.py|\
                  docs/pages/validate_generated_site.py|docs/pages/pineforge.css|PYPI_README.md)
                    docs_only=false
                    break
                    ;;
                  docs/*)
                    # The licence test rejects this basename anywhere in the source tree.
                    if [[ "${path##*/}" == [sS][oO][bB][oO][lL].[cC][cC] ]]; then
                      docs_only=false
                      break
                    fi
                    ;;
                  */*)
                    docs_only=false
                    break
                    ;;
                  # All remaining paths have no slash: only root Markdown/README is allowed.
                  *.md|README*) ;;
                  *)
                    docs_only=false
                    break
                    ;;
                esac
              done < "$paths_file"
            fi
          fi
          echo "docs_only=$docs_only" >> "$GITHUB_OUTPUT"
          echo "docs_only=$docs_only"

  optuna:
    name: Native TPE vs Optuna
    needs: changes
    if: >-
      ${{ !cancelled() &&
          (github.event_name != 'pull_request' || needs.changes.result != 'success' ||
           needs.changes.outputs.docs_only != 'true') }}
    runs-on: >-
      ${{ github.event_name != 'pull_request_target' &&
          github.actor != 'dependabot[bot]' && github.triggering_actor != 'dependabot[bot]' &&
          contains(fromJSON('["push","pull_request","workflow_dispatch","schedule","release"]'), github.event_name) &&
          (github.event_name != 'pull_request' ||
           (github.event.pull_request.head.repo.full_name == github.repository && github.event.pull_request.head.repo.fork == false)) &&
          fromJSON('["self-hosted","pf-ci","pf-ci-x64"]') || 'ubuntu-24.04' }}
    env:
      PF_CI_LABELS: '["self-hosted","pf-ci","pf-ci-x64"]'

    steps:
      - name: Check out PineForge HPO
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6

      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.13'
          cache: pip
          cache-dependency-path: benchmarks/optuna/requirements.txt

      - name: Install native dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y ninja-build

      - name: Install benchmark environment
        run: python -m pip install -r benchmarks/optuna/requirements.txt

      - name: Build native benchmark
        run: |
          cmake -S benchmarks/optuna -B build/benchmarks/optuna -G Ninja \
            -DCMAKE_BUILD_TYPE=Release
          cmake --build build/benchmarks/optuna \
            --target pineforge_hpo_optuna_native -j4

      - name: Run paired smoke profile
        run: |
          python benchmarks/optuna/run_benchmark.py \
            --native build/benchmarks/optuna/pineforge_hpo_optuna_native \
            --smoke \
            --output build/benchmarks/optuna/smoke.csv

      - name: Upload raw benchmark evidence
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: optuna-smoke-${{ github.run_id }}
          path: |
            build/benchmarks/optuna/smoke.csv
            build/benchmarks/optuna/smoke.csv.metadata.json
          if-no-files-found: error
          retention-days: 14

  build-gate:
    name: Benchmark verification gate
    needs: [changes, optuna]
    if: always()
    runs-on: ubuntu-24.04
    steps:
      - name: Require successful verification or a docs-only skip
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          CHANGES_RESULT: ${{ needs.changes.result }}
          DOCS_ONLY: ${{ needs.changes.outputs.docs_only }}
          OPTUNA_RESULT: ${{ needs.optuna.result }}
        run: |
          set -euo pipefail
          printf '%s\n' "changes: $CHANGES_RESULT, docs_only: $DOCS_ONLY" \
            "optuna: $OPTUNA_RESULT"
          [[ "$CHANGES_RESULT" == "success" ]]
          case "$DOCS_ONLY" in
            true) [[ "$EVENT_NAME" == "pull_request" ]] ;;
            false) ;;
            *) exit 1 ;;
          esac
          if [[ "$OPTUNA_RESULT" == "success" ]]; then exit 0; fi
          [[ "$DOCS_ONLY" == "true" && "$OPTUNA_RESULT" == "skipped" ]]
