name: Release assets

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: 'Replay hub notification for an existing published tag (vN.N.N or vN.N.NrcM)'
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: release-assets-${{ github.event.release.tag_name || inputs.tag }}
  cancel-in-progress: false

jobs:
  package:
    if: github.event_name == 'release'
    runs-on: >-
      ${{ github.event_name != 'pull_request_target' &&
          contains(fromJSON('["push","pull_request","workflow_dispatch","schedule","release"]'), github.event_name) &&
          (github.event_name != 'pull_request' ||
           (github.event.pull_request.head.repo.full_name == github.repository && github.event.pull_request.head.repo.fork == false)) &&
          fromJSON('["self-hosted","pf-ci","pf-ci-x64"]') || 'ubuntu-latest' }}
    env:
      PF_CI_LABELS: '["self-hosted","pf-ci","pf-ci-x64"]'
    permissions:
      contents: write
    steps:
      - name: Check out released source
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10
        with:
          ref: ${{ github.event.release.tag_name }}
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: '3.14'

      - name: Validate version and stamp catalog diff
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: |
          test "$RELEASE_TAG" = "v$(tr -d '\n' < VERSION)"
          python - <<'PY'
          import os
          from scripts.gen_catalog_diff import VERSION, version_key
          tag = os.environ["RELEASE_TAG"]
          assert VERSION.fullmatch(tag), "Release tag must use canonical PEP 440 spelling"
          version_key(tag)
          PY
          python scripts/gen_catalog_diff.py --release-version "${RELEASE_TAG#v}"
          python scripts/gen_catalog_diff.py --check --release-version "${RELEASE_TAG#v}"

      - name: Build Python package and catalog assets
        run: |
          python -m pip install build
          python -m build
          cp python/pineforge_hpo/hpo_failure_codes*.json dist/
          python - <<'PY'
          import json
          from pathlib import Path
          import zipfile
          wheel = next(Path("dist").glob("*.whl"))
          with zipfile.ZipFile(wheel) as archive:
              for name in ("hpo_failure_codes.json", "hpo_failure_codes_diff.json"):
                  assert archive.read("pineforge_hpo/" + name) == Path("dist", name).read_bytes()
              assert json.loads(archive.read("pineforge_hpo/hpo_failure_codes_diff.json"))["to"]["version"]
          PY

      - name: Upload release assets
        env:
          RELEASE_ID: ${{ github.event.release.id }}
          GH_REPOSITORY: ${{ github.repository }}
          GH_TOKEN: ${{ github.token }}
        run: |
          python - <<'PY'
          import mimetypes
          import os
          from pathlib import Path
          import urllib.parse
          import urllib.request
          for asset in sorted(Path("dist").iterdir()):
              url = ("https://uploads.github.com/repos/" + os.environ["GH_REPOSITORY"]
                     + "/releases/" + os.environ["RELEASE_ID"] + "/assets?"
                     + urllib.parse.urlencode({"name": asset.name}))
              request = urllib.request.Request(url, data=asset.read_bytes(), method="POST",
                  headers={"Authorization": "Bearer " + os.environ["GH_TOKEN"],
                           "Content-Type": mimetypes.guess_type(asset.name)[0]
                               or "application/octet-stream",
                           "Accept": "application/vnd.github+json"})
              with urllib.request.urlopen(request) as response:
                  assert response.status == 201
              print("Uploaded " + asset.name)
          PY

  # The producer event is not the hub's downstream release-ready manifest.
  # Replay verifies existing published bytes; it never rebuilds or uploads them.
  notify-hub:
    name: Notify release hub
    needs: package
    if: >-
      ${{ !cancelled() &&
          ((github.event_name == 'release' && needs.package.result == 'success') ||
           (github.event_name == 'workflow_dispatch' && needs.package.result == 'skipped')) }}
    runs-on: >-
      ${{ github.event_name != 'pull_request_target' &&
          contains(fromJSON('["push","pull_request","workflow_dispatch","schedule","release"]'), github.event_name) &&
          (github.event_name != 'pull_request' ||
           (github.event.pull_request.head.repo.full_name == github.repository && github.event.pull_request.head.repo.fork == false)) &&
          fromJSON('["self-hosted","pf-ci","pf-ci-x64"]') || 'ubuntu-latest' }}
    env:
      PF_CI_LABELS: '["self-hosted","pf-ci","pf-ci-x64"]'
    permissions:
      contents: read
    steps:
      - name: Check out notification implementation
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
        with:
          # Historical tags need the current replay implementation, not their old scripts.
          ref: ${{ github.workflow_sha }}
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.14'

      - name: Mint org App token (hub dispatch only)
        id: app
        uses: actions/create-github-app-token@fee1f7d63c2ff003460e3d139729b119787bc349 # v2
        with:
          app-id: ${{ secrets.PINEFORGE_APP_ID }}
          private-key: ${{ secrets.PINEFORGE_APP_PRIVATE_KEY }}
          owner: pineforge-4pass
          repositories: pineforge-release
          permission-contents: write
          github-api-url: https://api.github.com

      - name: Verify published artifacts and dispatch hpo-release
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name || inputs.tag }}
          RELEASE_READ_TOKEN: ${{ github.token }}
          HUB_DISPATCH_TOKEN: ${{ steps.app.outputs.token }}
        run: |
          python scripts/notify_release_hub.py --tag "$RELEASE_TAG" \
            --receipt "$RUNNER_TEMP/hpo-hub-notification.json"

      - name: Retain dispatch acceptance receipt
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: hpo-hub-notification-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/hpo-hub-notification.json
          if-no-files-found: error

      - name: Report notification failure
        if: failure()
        run: |
          echo '::error title=HPO hub notification failed::No hub readiness is confirmed. Inspect this run, repair the failed prerequisite, then replay the published tag.'
          echo "Notification failed: ${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}. Replay this workflow with the published tag after repair." >> "$GITHUB_STEP_SUMMARY"
