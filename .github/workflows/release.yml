name: Release assets

on:
  workflow_dispatch:
    inputs:
      tag:
        description: 'Published release tag on main (vN.N.N or vN.N.NrcM)'
        required: true
        type: string
      package:
        description: 'Build and upload assets before notifying the hub (false replays only)'
        required: false
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: release-assets-${{ inputs.tag }}
  cancel-in-progress: false

jobs:
  tag-guard:
    runs-on: ["self-hosted","pf-ci","pf-ci-release"]
    permissions:
      contents: read
    outputs:
      sha: ${{ steps.verify.outputs.sha }}
    steps:
      - name: Require dispatch on main before checkout
        env:
          WORKFLOW_REF: ${{ github.ref }}
          WORKFLOW_EVENT: ${{ github.event_name }}
        shell: bash
        run: |
          set -euo pipefail
          if [[ "$WORKFLOW_REF" != refs/heads/main || "$WORKFLOW_EVENT" != workflow_dispatch ]]; then
            echo '::error::Release assets must be dispatched on refs/heads/main.'
            exit 1
          fi

      - name: Check out main history for tag verification
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
        with:
          ref: main
          fetch-depth: 0
          persist-credentials: false

      - name: Verify release tag and main ancestry
        id: verify
        env:
          TAG: ${{ inputs.tag }}
          WORKFLOW_REF: ${{ github.ref }}
          WORKFLOW_EVENT: ${{ github.event_name }}
        shell: bash
        run: |
          set -euo pipefail
          if [[ "$WORKFLOW_REF" != refs/heads/main || "$WORKFLOW_EVENT" != workflow_dispatch ]]; then
            echo '::error::Release assets must be dispatched on refs/heads/main.'
            exit 1
          fi
          if [[ ! "$TAG" =~ ^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)(rc[1-9][0-9]*)?$ ]]; then
            echo '::error::Tag must use vN.N.N or vN.N.NrcM, no leading zeros, M >= 1.'
            exit 1
          fi
          git fetch --no-recurse-submodules origin '+refs/heads/main:refs/remotes/origin/main'
          git fetch --tags --force --no-recurse-submodules origin
          if ! TAG_COMMIT="$(git rev-parse -q --verify "refs/tags/${TAG}^{commit}")"; then
            echo '::error::Release tag does not exist or does not peel to a commit.'
            exit 1
          fi
          if [[ ! "$TAG_COMMIT" =~ ^[0-9a-f]{40}$ ]]; then
            echo '::error::Release tag did not resolve to a full commit SHA.'
            exit 1
          fi
          if ! git merge-base --is-ancestor "$TAG_COMMIT" origin/main; then
            echo '::error::Release tag commit is not reachable from origin/main.'
            exit 1
          fi
          printf 'sha=%s\n' "$TAG_COMMIT" >> "$GITHUB_OUTPUT"

  package:
    needs: tag-guard
    if: >-
      ${{ github.event_name == 'workflow_dispatch' &&
          github.ref == 'refs/heads/main' && inputs.package }}
    runs-on: ["self-hosted","pf-ci","pf-ci-release"]
    permissions:
      contents: write
    steps:
      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: '3.14'

      - name: Find published release for asset upload
        id: release
        env:
          RELEASE_TAG: ${{ inputs.tag }}
          GH_REPOSITORY: ${{ github.repository }}
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          gh api "repos/${GH_REPOSITORY}/releases/tags/${RELEASE_TAG}" > "$RUNNER_TEMP/hpo-release.json"
          python - <<'PY'
          import json
          import os
          from pathlib import Path
          release_path = Path(os.environ["RUNNER_TEMP"]) / "hpo-release.json"
          release = json.loads(release_path.read_text())
          if (
              release.get("draft") is not False
              or not release.get("published_at")
              or release.get("tag_name") != os.environ["RELEASE_TAG"]
              or type(release.get("id")) is not int
              or release["id"] <= 0
          ):
              raise SystemExit("Release must exist and be published for the verified tag")
          with open(os.environ["GITHUB_OUTPUT"], "a") as output:
              output.write(f"id={release['id']}\n")
          PY

      - name: Check out released source
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10
        with:
          ref: ${{ needs.tag-guard.outputs.sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Validate version and stamp catalog diff
        env:
          RELEASE_TAG: ${{ inputs.tag }}
        run: |
          test "$RELEASE_TAG" = "v$(tr -d '\n' < VERSION)"
          python - <<'PY'
          import os
          from scripts.gen_catalog_diff import VERSION, version_key
          tag = os.environ["RELEASE_TAG"]
          assert VERSION.fullmatch(tag), "Release tag must use canonical PEP 440 spelling"
          version_key(tag)
          PY
          python scripts/gen_catalog_diff.py --release-version "${RELEASE_TAG#v}"
          python scripts/gen_catalog_diff.py --check --release-version "${RELEASE_TAG#v}"

      - name: Build Python package and catalog assets
        run: |
          python -m pip install build
          python -m build
          cp python/pineforge_hpo/hpo_failure_codes*.json dist/
          python - <<'PY'
          import json
          from pathlib import Path
          import zipfile
          wheel = next(Path("dist").glob("*.whl"))
          with zipfile.ZipFile(wheel) as archive:
              for name in ("hpo_failure_codes.json", "hpo_failure_codes_diff.json"):
                  assert archive.read("pineforge_hpo/" + name) == Path("dist", name).read_bytes()
              assert json.loads(archive.read("pineforge_hpo/hpo_failure_codes_diff.json"))["to"]["version"]
          PY

      - name: Upload release assets
        env:
          RELEASE_ID: ${{ steps.release.outputs.id }}
          GH_REPOSITORY: ${{ github.repository }}
          GH_TOKEN: ${{ github.token }}
        run: |
          python - <<'PY'
          import mimetypes
          import os
          from pathlib import Path
          import urllib.parse
          import urllib.request
          for asset in sorted(Path("dist").iterdir()):
              url = ("https://uploads.github.com/repos/" + os.environ["GH_REPOSITORY"]
                     + "/releases/" + os.environ["RELEASE_ID"] + "/assets?"
                     + urllib.parse.urlencode({"name": asset.name}))
              request = urllib.request.Request(url, data=asset.read_bytes(), method="POST",
                  headers={"Authorization": "Bearer " + os.environ["GH_TOKEN"],
                           "Content-Type": mimetypes.guess_type(asset.name)[0]
                               or "application/octet-stream",
                           "Accept": "application/vnd.github+json"})
              with urllib.request.urlopen(request) as response:
                  assert response.status == 201
              print("Uploaded " + asset.name)
          PY

  # The producer event is not the hub's downstream release-ready manifest.
  # With package=false, replay verifies bytes without rebuilding or uploading.
  notify-hub:
    name: Notify release hub
    needs: [tag-guard, package]
    if: >-
      ${{ !cancelled() && github.event_name == 'workflow_dispatch' &&
          github.ref == 'refs/heads/main' &&
          (needs.tag-guard.result != 'success' ||
           (inputs.package && needs.package.result == 'success') ||
           (!inputs.package && needs.package.result == 'skipped')) }}
    runs-on: ["self-hosted","pf-ci","pf-ci-release"]
    permissions:
      contents: read
    steps:
      - name: Refuse notification without a successful tag guard
        env:
          TAG_GUARD_RESULT: ${{ needs.tag-guard.result }}
        shell: bash
        run: |
          set -euo pipefail
          if [[ "$TAG_GUARD_RESULT" != success ]]; then
            echo '::error::Tag guard failed or was skipped; refusing checkout and notification.'
            exit 1
          fi

      - name: Check out notification implementation
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
        with:
          # Historical tags need the current replay implementation, not their old scripts.
          ref: ${{ github.workflow_sha }}
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.14'

      - name: Mint org App token (hub dispatch only)
        id: app
        uses: actions/create-github-app-token@fee1f7d63c2ff003460e3d139729b119787bc349 # v2
        with:
          app-id: ${{ secrets.PINEFORGE_APP_ID }}
          private-key: ${{ secrets.PINEFORGE_APP_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}
          repositories: pineforge-release
          permission-contents: write
          github-api-url: https://api.github.com

      - name: Verify published artifacts and dispatch hpo-release
        env:
          RELEASE_TAG: ${{ inputs.tag }}
          RELEASE_READ_TOKEN: ${{ github.token }}
          HUB_DISPATCH_TOKEN: ${{ steps.app.outputs.token }}
        run: |
          python scripts/notify_release_hub.py --tag "$RELEASE_TAG" \
            --receipt "$RUNNER_TEMP/hpo-hub-notification.json"

      - name: Retain dispatch acceptance receipt
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: hpo-hub-notification-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/hpo-hub-notification.json
          if-no-files-found: error

      - name: Report notification failure
        if: failure()
        run: |
          echo '::error title=HPO hub notification failed::No hub readiness is confirmed. Inspect this run, repair the failed prerequisite, then replay the published tag.'
          echo "Notification failed: ${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}. Replay this workflow with the published tag after repair." >> "$GITHUB_STEP_SUMMARY"
