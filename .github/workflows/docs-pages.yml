name: API documentation

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/docs-pages.yml"
      - "Doxyfile"
      - "VERSION"
      - "README.md"
      - "CONTRIBUTING.md"
      - "LEGAL.md"
      - "SECURITY.md"
      - "docs/**"
      - "include/**"
      - "python/**"
      - "benchmarks/**/*.md"
  pull_request:
    paths:
      - ".github/workflows/docs-pages.yml"
      - "Doxyfile"
      - "VERSION"
      - "README.md"
      - "CONTRIBUTING.md"
      - "LEGAL.md"
      - "SECURITY.md"
      - "docs/**"
      - "include/**"
      - "python/**"
      - "benchmarks/**/*.md"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: docs-pages-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build:
    name: Build API reference
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6

      - name: Install Doxygen
        run: |
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends doxygen

      - name: Generate documentation
        run: |
          rm -rf build/docs
          mkdir -p build/docs
          PROJECT_NUMBER="$(tr -d '\n' < VERSION)" doxygen Doxyfile
          python3 docs/pages/validate_generated_site.py build/docs/html
          touch build/docs/html/.nojekyll
          test -s build/docs/html/index.html
          test -s build/docs/html/annotated.html
          test ! -s build/docs/doxygen-warnings.log

      - name: Upload GitHub Pages artifact
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        uses: actions/upload-pages-artifact@7b1f4a764d45c48632c6b24a0339c27f5614fb0b # v4
        with:
          path: build/docs/html

  deploy:
    name: Deploy GitHub Pages
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    needs: build
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Configure GitHub Pages
        uses: actions/configure-pages@983d7736d9b0ae728b81ab479565c72886d7745b # v5

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4
