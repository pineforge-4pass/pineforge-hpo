name: Feature proposal
description: Propose a scoped optimizer, execution, objective, or API capability.
title: "[Proposal]: "
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: Describe the study or workflow that cannot be expressed today.
    validations:
      required: true
  - type: textarea
    id: contract
    attributes:
      label: Proposed user-facing contract
      description: Show the desired C++, CLI, or StudySpec shape.
      render: text
    validations:
      required: true
  - type: dropdown
    id: area
    attributes:
      label: Area
      options:
        - Sampler or search space
        - Objective or constraints
        - Trial execution
        - Artifact and transpiler bridge
        - Portfolio or multiple strategy
        - Persistence or distributed execution
        - API or documentation
        - Benchmark infrastructure
    validations:
      required: true
  - type: textarea
    id: tradeoffs
    attributes:
      label: Alternatives and tradeoffs
      description: Include determinism, compatibility, dependencies, and performance impact.
    validations:
      required: true
  - type: textarea
    id: validation
    attributes:
      label: Validation plan
      description: Explain how correctness and, where relevant, optimizer quality would be measured.
    validations:
      required: true
